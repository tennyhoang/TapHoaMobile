name: 🎯 EAS Production

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel prod deployments

jobs:
  # ─────────────────────────────────────────
  # Gate: run full CI before any deployment
  # ─────────────────────────────────────────
  pre-deploy-checks:
    name: ✅ Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:coverage

  # ─────────────────────────────────────────
  # OTA Update → production channel
  # ─────────────────────────────────────────
  ota-production:
    name: 📡 OTA Update → production channel
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps
      - name: Publish OTA to production
        run: eas update --branch=production --message="Release ${{ github.ref_name }}" --non-interactive

  # ─────────────────────────────────────────
  # Full native build (on new release tag)
  # ─────────────────────────────────────────
  build-production:
    name: 📦 Production Build
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    strategy:
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.platform }}
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive

  # ─────────────────────────────────────────
  # Submit to App Stores (after build)
  # ─────────────────────────────────────────
  submit:
    name: 🏪 Submit to Stores
    needs: build-production
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    strategy:
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Submit ${{ matrix.platform }}
        run: eas submit --platform ${{ matrix.platform }} --latest --non-interactive
