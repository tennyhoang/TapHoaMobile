name: 🚀 EAS Preview (Staging)

on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # OTA Update — fast deploy, no native build
  # ─────────────────────────────────────────
  ota-update:
    name: 📡 OTA Update → preview channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish OTA update
        run: eas update --branch=preview --message="${{ github.event.head_commit.message }}" --non-interactive

  # ─────────────────────────────────────────
  # Native build (APK for Android testers)
  # Runs only when native code changes
  # ─────────────────────────────────────────
  build-android-preview:
    name: 🤖 Android Preview Build
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[native]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Comment build URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🤖 Android preview build submitted to EAS. Check progress at https://expo.dev'
            });
