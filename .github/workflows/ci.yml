name: ✅ CI

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────
  # Job 1: Type check + Lint + Format
  # ─────────────────────────────────────────
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ─────────────────────────────────────────
  # Job 2: Unit tests + Coverage
  # ─────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build JS bundle + source maps (Android & iOS)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx expo export --platform android --source-maps --output-dir dist/android
          npx expo export --platform ios     --source-maps --output-dir dist/ios

      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "⚠️  SENTRY_AUTH_TOKEN not set — skipping source map upload"
            exit 0
          fi

          RELEASE="${{ github.sha }}"

          # Create release và gắn commits
          npx @sentry/cli releases new "$RELEASE"
          npx @sentry/cli releases set-commits "$RELEASE" --auto

          # Upload source maps Android
          npx @sentry/cli sourcemaps upload \
            --release "$RELEASE" \
            --dist "android" \
            dist/android/

          # Upload source maps iOS
          npx @sentry/cli sourcemaps upload \
            --release "$RELEASE" \
            --dist "ios" \
            dist/ios/

          # Finalize release
          npx @sentry/cli releases finalize "$RELEASE"

          echo "✅ Source maps uploaded for release $RELEASE"
        continue-on-error: true

  # ─────────────────────────────────────────
  # Job 3: Dependency security audit
  # ─────────────────────────────────────────
  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true
