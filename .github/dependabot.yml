version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      expo-sdk:
        patterns: ["expo*", "@expo*"]
      react-native:
        patterns: ["react-native*", "@react-native*"]
      tanstack:
        patterns: ["@tanstack*"]
      testing:
        patterns: ["jest*", "jest-expo*", "@testing-library*"]
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
